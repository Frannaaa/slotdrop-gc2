services:
  - type: web
    name: slotdrop-gc2-group
    runtime: node
    branch: main
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node tools/db-bootstrap.mjs && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: slotdrop-gc2-group-db
          property: connectionString
databases:
  - name: slotdrop-gc2-group-db
    region: singapore
    plan: free
    postgresMajorVersion: '16'
    ipAllowList: []
