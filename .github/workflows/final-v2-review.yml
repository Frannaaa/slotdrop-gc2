name: Final V2 browser and reflection review
on:
  push:
    branches: ['g1/m1-final-testing-clarification']
    paths:
      - '.github/workflows/final-v2-review.yml'
      - 'tools/build-final-reflection.py'
      - 'tools/check-v2-browser.mjs'
      - 'docs/SlotDrop_Final_Reflection.source.json'
      - 'public/js/selection.js'
      - 'public/js/checkout.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-v2-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser QA tool without changing application dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-v2-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-v2-browser
          path: docs/evidence/v2-browser.json
  reflection:
    needs: browser
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.ref == 'refs/heads/g1/m1-final-testing-clarification'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab pypdf pypdfium2 Pillow
      - run: python tools/build-final-reflection.py
      - uses: actions/download-artifact@v4
        with:
          name: final-v2-browser
          path: docs/evidence/
      - name: Save generated PDF, previews and measured QA to the review branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SlotDrop_Final_Reflection.pdf docs/evidence/reflection-v2-page-1.png docs/evidence/reflection-v2-page-2.png docs/evidence/reflection-v2-layout.json docs/evidence/v2-browser.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Build two-page V2 reflection and save browser QA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:refs/heads/g1/m1-final-testing-clarification
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
