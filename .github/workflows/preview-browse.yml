name: Prepare SlotDrop release bundle
on:
  push:
    branches: ['qa/gc2-browse-final-preview']
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Integrate the four captain-owned heads in a disposable checkout
        run: |
          git config user.name "SlotDrop QA"
          git config user.email "slotdrop-qa@example.invalid"
          git checkout --detach e7501d8cea5728bc8c6fac840e68c95772fb9eea
          git merge --no-ff --no-edit a925345035db9419825d4f533bbebe7cbc7b7f38
          git merge --no-ff --no-edit e2595937a366eec7937faf168a7f5642646c67a2
          git merge --no-ff --no-edit 7e358d570ff71055d95afa844259146cf0f26bf7
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
          const parents = ["e7501d8cea5728bc8c6fac840e68c95772fb9eea","a925345035db9419825d4f533bbebe7cbc7b7f38","e2595937a366eec7937faf168a7f5642646c67a2","7e358d570ff71055d95afa844259146cf0f26bf7"];
          const file = 'docs/gc2-submission-gate.md';
          const older = "- [ ] Review and merge the final documentation/recording PRs [#82](https://github.com/Frannaaa/slotdrop-gc2/pull/82) and [#83](https://github.com/Frannaaa/slotdrop-gc2/pull/83), and any approved customer UI changes [#81](https://github.com/Frannaaa/slotdrop-gc2/pull/81). The optional [favicon/Lighthouse fix #84](https://github.com/Frannaaa/slotdrop-gc2/pull/84) passed CI but requires review, deployment and a new Lighthouse run before claiming Best Practices 100. Avoid merging stale duplicate UI branches without reconciling their current-main differences.";
          const newer = "- [ ] Get a teammate review of the [combined release PR #81](https://github.com/Frannaaa/slotdrop-gc2/pull/81). It includes Browse and the archive, the benchmark and recording links, and the favicon and load-time fixes. Confirm the reviewed commit is live on Render before recording new public scores.";
          const checklist = readFileSync(file, 'utf8');
          if (checklist.split(older).length !== 2) throw new Error('Release checklist moved');
          writeFileSync(file, checklist.replace(older, newer));
          git('add', '--', file);
          git('diff', '--cached', '--check', parents[0], '--', '.', ':(exclude)docs/SlotDrop_GC2_Summary.pdf');
          const tree = git('write-tree').trim();
          const changed = git('diff', '--cached', '--name-only', '--no-renames', '-z', parents[0]);
          const files = [];
          for (const [index, path] of changed.split('\0').filter(Boolean).entries()) {
            const match = git('ls-files', '--stage', '--', path).trim().match(/^(\d{6}) ([a-f0-9]{40}) 0\t/);
            if (!match) throw new Error('Unexpected index entry for ' + path);
            const [, mode, sha] = match;
            const known = parents.some(ref => {
              const result = spawnSync('git', ['rev-parse', '--verify', '--quiet', ref + ':' + path], { encoding: 'utf8' });
              return result.status === 0 && result.stdout.trim() === sha;
            });
            files.push({ index, path, mode, sha, known });
            if (!known) {
              const content = readFileSync(path).toString('base64');
              const chunks = content.match(/.{1,4096}/g) || [''];
              for (const [part, data] of chunks.entries())
                console.log('SLOTDROP_BUNDLE_BLOB ' + JSON.stringify({ index, part, total: chunks.length, data }));
            }
          }
          console.log('SLOTDROP_BUNDLE_TREE ' + JSON.stringify({ parents, tree, files }));
          NODE
