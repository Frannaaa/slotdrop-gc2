name: SlotDrop release-candidate and mobile Browse checks
on:
  push:
    branches: ['qa/gc2-browse-final-preview']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slotdrop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Combine the six current pull requests
        run: |
          cp tools/preview-grouped-browse.mjs "$RUNNER_TEMP/preview-grouped-browse.mjs"
          git config user.name "SlotDrop QA"
          git config user.email "slotdrop-qa@example.invalid"
          git checkout --detach 3ef579da60439a73dbbfc1700a3dc1b9def29806
          git merge --no-ff --no-edit 4355039aeda36c1a5e1d9a5a1b44f2002133c1a7
          git merge --no-ff --no-edit e7081969dc41211a90c1feeadcc9d73b8cbf9aab
          git merge --no-ff --no-edit e7501d8cea5728bc8c6fac840e68c95772fb9eea
          git merge --no-ff --no-edit 1a82d2354d740e5dd2b361336ad0cb11e43dde3f
          git merge --no-ff --no-edit e2595937a366eec7937faf168a7f5642646c67a2
          git merge --no-ff --no-edit 7e358d570ff71055d95afa844259146cf0f26bf7
          git diff --check 3ef579da60439a73dbbfc1700a3dc1b9def29806 -- . ':(exclude)docs/SlotDrop_GC2_Summary.pdf'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit reachable Git history for prohibited tracked filenames
        run: node tools/audit-git-paths.mjs
      - name: Scan historical source blobs for high-confidence secret signatures
        run: node tools/audit-git-signatures.mjs
      - run: npm run check:sql
      - name: API tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slotdrop_test
      - name: Fran transaction smoke (disposable DB; save receipt and check Owner)
        run: node tools/check-transaction-smoke.mjs
      - name: Build and initialize production image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker build -t slotdrop-ci .
          docker run --rm --network host -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/slotdrop_test slotdrop-ci node tools/db-init.mjs
      - name: Verify persistence across production-container restart
        if: ${{ hashFiles('tools/check-release.mjs') != '' }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slotdrop_test
        run: |
          docker run -d --name slotdrop-ci --network host -e PORT=3100 -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/slotdrop_test slotdrop-ci
          node tools/check-release.mjs before
          docker restart slotdrop-ci
          node tools/check-release.mjs after
      - name: Stop production test container
        if: ${{ always() && hashFiles('tools/check-release.mjs') != '' }}
        run: docker rm -f slotdrop-ci || true

      - name: Install mobile browser tools
        run: |
          npm install --include=dev --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1 lighthouse@13.6.0
          npx --no-install playwright install --with-deps chromium
      - name: Check grouped Browse and run mobile Lighthouse three times
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/slotdrop_test
          PORT: 3100
          NODE_ENV: production
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await c.connect();
          try {
            await c.query(`UPDATE slots SET starts_at=NOW()-INTERVAL '1 day',
              booking_closes_at=NOW()-INTERVAL '25 hours'
              WHERE id=(SELECT id FROM slots WHERE starts_at IS NOT NULL AND status='open' ORDER BY id LIMIT 1)`);
          } finally { await c.end(); }
          NODE
          cp "$RUNNER_TEMP/preview-grouped-browse.mjs" .slotdrop-browse-preview.mjs
          npm start > "$RUNNER_TEMP/slotdrop-preview.log" 2>&1 &
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 5 http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            sleep 1
          done
          node .slotdrop-browse-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slotdrop-grouped-browse-and-lighthouse
          path: browse-preview/
          retention-days: 30
