name: Compress existing SlotDrop web fonts
on:
  push:
    branches: ['qa/gc2-browse-final-preview']
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Encode WOFF2 and check every font table's round trip
        run: |
          python -m pip -q install 'fonttools[woff]==4.61.1'
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          from fontTools.ttLib import TTFont
          for path in sorted(Path("public/fonts").glob("*.ttf")):
              source = TTFont(path, recalcTimestamp=False)
              target = path.with_suffix(".woff2")
              source.flavor = "woff2"
              source.save(target)
              decoded = TTFont(target, recalcTimestamp=False)
              assert decoded.getGlyphOrder() == source.getGlyphOrder()
              assert decoded.getBestCmap() == source.getBestCmap()
              assert decoded["hmtx"].metrics == source["hmtx"].metrics
              assert decoded["name"].getDebugName(1) == source["name"].getDebugName(1)
              data = target.read_bytes()
              assert data[:4] == b"wOF2" and len(data) < path.stat().st_size
              print("SLOTDROP_WOFF2 " + json.dumps({
                  "name": target.name, "originalBytes": path.stat().st_size,
                  "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(),
                  "base64": base64.b64encode(data).decode("ascii"),
              }))
          PY
