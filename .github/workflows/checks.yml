name: GC2 checks
on:
  push:
    branches: ['main', 'g1/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slotdrop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:sql
      - name: PostgreSQL HTTP and locking tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slotdrop_test
      - name: Build and initialize production image
        run: |
          docker build -t slotdrop-ci .
          docker run --rm --network host -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/slotdrop_test slotdrop-ci node tools/db-init.mjs
      - name: Verify persistence across production-container restart
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slotdrop_test
        run: |
          docker run -d --name slotdrop-ci --network host -e PORT=3100 -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/slotdrop_test slotdrop-ci
          node tools/check-release.mjs before
          docker restart slotdrop-ci
          node tools/check-release.mjs after
      - name: Stop production test container
        if: always()
        run: docker rm -f slotdrop-ci || true
