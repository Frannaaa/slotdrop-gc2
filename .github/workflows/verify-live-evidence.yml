name: SlotDrop final read-only readiness
on:
  push:
    branches: ['qa/gc2-live-3ef579d']
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check health and count practice seats
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://slotdrop-gc2-group-zx8j.onrender.com';
          let healthy = false;
          for (let attempt = 0; attempt < 3 && !healthy; attempt++) {
            try {
              const response = await fetch(origin + '/api/health', { signal: AbortSignal.timeout(45000) });
              healthy = response.ok && (await response.json()).status === 'ok';
            } catch {}
            if (!healthy && attempt < 2) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!healthy) throw new Error('The public deployment did not become ready');
          const get = async path => {
            const response = await fetch(origin + path, { signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error(path + ' returned ' + response.status);
            return response.json();
          };
          const [slots, catalog] = await Promise.all([get('/api/slots'), get('/api/owner/catalog')]);
          const practice = slots.filter(slot => slot.startsAt === null && slot.bookingClosesAt === null)
            .map(({ id, serviceName, remainingSeats }) => ({ id, serviceName, remainingSeats }));
          console.log('GC2_FINAL_INVENTORY ' + JSON.stringify({ checkedAt: new Date().toISOString(),
            bookable: slots.length, catalogServices: catalog.services.length, activeServices: catalog.services.filter(item => item.active).length, practice }));
          if (!practice.some(item => item.remainingSeats > 0)) throw new Error('No bookable practice capacity');
          NODE
      - name: Run the release readiness checks
        run: npm run check:gc2 -- https://slotdrop-gc2-group-zx8j.onrender.com
