# Group assignment: Fran. Render's free plan sleeps after 15 idle minutes, and a sleeping
# instance can take a minute or more to answer. Visiting /api/health every 10 minutes keeps
# the graded deployment awake. A failed run means the site did not answer within ~4 minutes.
name: Keep deployment awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HEALTH_URL: https://slotdrop-gc2-group-zx8j.onrender.com/api/health
    steps:
      - name: Check /api/health
        run: |
          for attempt in $(seq 1 8); do
            status=$(curl -s -m 25 -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "attempt $attempt: $status"
            [ "$status" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::$HEALTH_URL did not return 200. Redeploy from the Render dashboard (Manual Deploy → Deploy latest commit)."
          exit 1
