# Scheduled runs start after this workflow is merged to the default branch.
# GitHub may delay schedules. Open the app before presenting as well.
name: Keep deployment awake

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/keep-awake.yml'
      - 'tools/prepare-presentation.ps1'
      - 'tools/check-final-readiness.mjs'

permissions:
  contents: read

concurrency:
  group: deployment-health-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://slotdrop-gc2-group-zx8j.onrender.com/api/health
    steps:
      - name: Request the public health route
        shell: bash
        run: |
          for attempt in $(seq 1 6); do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$HEALTH_URL" || true)
            echo "attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Health route returned HTTP 200 at $(date -u +%FT%TZ)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Health route did not return HTTP 200. Check Render status and logs before presenting.'
          exit 1

  deployed-readiness:
    if: github.event_name != 'schedule'
    needs: ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Inspect the existing public deployment without saving anything
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Read-only preflight attempt $attempt"
            if node tools/check-gc2-readiness.mjs https://slotdrop-gc2-group-zx8j.onrender.com; then
              echo "All public preflight checks passed on attempt $attempt." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" = "1" ]; then
              echo '::warning::The first preflight failed. Its results remain above; retrying GET checks once after warm-up.'
              sleep 5
            fi
          done
          exit 1
