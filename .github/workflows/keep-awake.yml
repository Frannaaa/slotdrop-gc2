# Scheduled runs start after this workflow is merged to the default branch.
# GitHub may delay schedules. Open the app before presenting as well.
name: Keep deployment awake

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/keep-awake.yml'

permissions:
  contents: read

concurrency:
  group: deployment-health-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://slotdrop-gc2-group-zx8j.onrender.com/api/health
    steps:
      - name: Request the public health route
        shell: bash
        run: |
          for attempt in $(seq 1 6); do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$HEALTH_URL" || true)
            echo "attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Health route returned HTTP 200 at $(date -u +%FT%TZ)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Health route did not return HTTP 200. Check Render status and logs before presenting.'
          exit 1
