name: SlotDrop outsider phone receipt cross-check
on:
  push:
    branches: ['qa/gc2-outsider-receipt-20261116']
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read saved phone-test receipt and match Owner list
        run: node tools/verify-outsider-booking.mjs
      - name: Install browser for Owner UI confirmation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Capture Owner row for verified phone booking
        run: node tools/screenshot-outsider-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slotdrop-outsider-receipt-check
          path: outsider-evidence/
          retention-days: 90
